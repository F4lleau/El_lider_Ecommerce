openapi: 3.0.3
info:
  title: Ecommerce Pastelería API
  version: 1.0.0
  description: API REST modular para ecommerce de pastelería y repostería.
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Registro de usuario
      description: Crea una cuenta pública con rol USER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201": { description: Usuario registrado }
        "400": { description: Datos inválidos }
        "409": { description: Email ya registrado }
  /auth/login:
    post:
      summary: Login de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Login exitoso }
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
  /auth/me:
    get:
      summary: Sesión autenticada actual
      description: Devuelve el usuario autenticado sin campos sensibles.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Usuario autenticado }
        "401": { description: Token ausente, inválido o expirado }
  /users/me:
    get:
      summary: Perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Perfil }
  /categories:
    get:
      summary: Listar categorías
      responses:
        "200": { description: Lista de categorías }
  /categories/{slug}/products:
    get:
      summary: Productos de una categoría
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Lista de productos }
  /products:
    get:
      summary: Listar productos
      responses:
        "200": { description: Lista de productos }
  /products/{id}:
    get:
      summary: Detalle de producto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Producto }
  /cart:
    get:
      summary: Ver carrito propio
      description: Devuelve el carrito autenticado con precios actuales y subtotal recalculado.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Carrito }
        "401": { description: Token requerido }
    delete:
      summary: Vaciar carrito
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Carrito vaciado }
        "401": { description: Token requerido }
  /cart/validate:
    post:
      summary: Validar carrito invitado
      description: Endpoint público que hidrata items mínimos usando precio, disponibilidad y stock actuales.
      requestBody:
        required: true
        content:
          application/json:
            example:
              items:
                - productId: 1
                  quantity: 2
            schema:
              $ref: "#/components/schemas/CartItemsRequest"
      responses:
        "200": { description: Carrito invitado validado }
        "400": { description: Datos inválidos }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/sync:
    post:
      summary: Sincronizar carrito invitado
      description: Fusiona cantidades del carrito invitado con el carrito del usuario autenticado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              items:
                - productId: 1
                  quantity: 2
            schema:
              $ref: "#/components/schemas/CartItemsRequest"
      responses:
        "200": { description: Carrito sincronizado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/items:
    post:
      summary: Agregar producto al carrito
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId: { type: integer }
                quantity: { type: integer }
      responses:
        "200": { description: Producto agregado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/items/{itemId}:
    patch:
      summary: Modificar cantidad de un item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer }
      responses:
        "200": { description: Item actualizado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Item no encontrado o ajeno }
        "409": { description: Producto inactivo o stock insuficiente }
    delete:
      summary: Eliminar item del carrito
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Item eliminado }
        "401": { description: Token requerido }
        "404": { description: Item no encontrado o ajeno }
  /orders:
    get:
      summary: Listar órdenes propias
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista de órdenes }
  /orders/{id}:
    get:
      summary: Detalle de orden propia
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Orden }
  /orders/checkout:
    post:
      summary: Checkout y crear orden
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: object }
                paymentMethod: { type: string }
                notes: { type: string }
      responses:
        "201": { description: Orden creada }
components:
  schemas:
    CartItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 100 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
