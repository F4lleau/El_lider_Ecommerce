openapi: 3.0.3
info:
  title: Ecommerce Pastelería API
  version: 1.0.0
  description: API REST modular para ecommerce de pastelería y repostería.
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Registro de usuario
      description: Crea una cuenta pública con rol USER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201": { description: Usuario registrado }
        "400": { description: Datos inválidos }
        "409": { description: Email ya registrado }
  /auth/login:
    post:
      summary: Login de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Login exitoso }
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
        "423": { description: Cuenta bloqueada temporalmente }
  /auth/forgot-password:
    post:
      summary: Solicitar recuperacion de contrasena
      description: Responde siempre con un mensaje generico para no revelar si el email existe. En development/test puede devolver resetUrl para pruebas locales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Solicitud recibida con mensaje generico }
        "400": { description: Email invalido }
  /auth/validate-reset-token:
    post:
      summary: Validar token de recuperacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Token valido }
        "400": { description: Token invalido, usado o expirado }
  /auth/reset-password:
    post:
      summary: Resetear contrasena
      description: Valida token, confirmacion y politica de contrasena. Al finalizar limpia intentos fallidos y desbloquea la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token: { type: string }
                password: { type: string, example: NuevaClave1! }
                confirmPassword: { type: string, example: NuevaClave1! }
      responses:
        "200": { description: Contrasena actualizada }
        "400": { description: Token invalido, expirado, usado o contrasena insegura }
  /auth/me:
    get:
      summary: Sesión autenticada actual
      description: Devuelve el usuario autenticado sin campos sensibles.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Usuario autenticado }
        "401": { description: Token ausente, inválido o expirado }
  /users/me:
    get:
      summary: Perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Perfil }
        "401": { description: Token requerido }
        "404": { description: Usuario no encontrado }
    patch:
      summary: Actualizar perfil del usuario autenticado
      description: Actualiza datos basicos. El email queda solo lectura.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
      responses:
        "200": { description: Perfil actualizado }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "404": { description: Usuario no encontrado }
  /users/me/addresses:
    get:
      summary: Listar direcciones propias
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Direcciones del usuario }
        "401": { description: Token requerido }
    post:
      summary: Crear direccion propia
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAddressWrite" }
      responses:
        "201": { description: Direccion creada }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
  /users/me/addresses/{id}:
    patch:
      summary: Editar direccion propia
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAddressWrite" }
      responses:
        "200": { description: Direccion actualizada }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "404": { description: Direccion no encontrada o ajena }
    delete:
      summary: Eliminar direccion propia
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Direccion eliminada }
        "401": { description: Token requerido }
        "404": { description: Direccion no encontrada o ajena }
  /users/me/addresses/{id}/default:
    patch:
      summary: Marcar direccion propia como principal
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Direccion principal actualizada }
        "401": { description: Token requerido }
        "404": { description: Direccion no encontrada o ajena }
  /users/me/orders:
    get:
      summary: Listar pedidos propios
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pedidos propios }
        "401": { description: Token requerido }
  /users/me/orders/{id}:
    get:
      summary: Detalle de pedido propio
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Pedido propio }
        "401": { description: Token requerido }
        "404": { description: Pedido no encontrado o ajeno }
  /users/me/stock-requests:
    get:
      summary: Listar solicitudes de stock propias
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Solicitudes propias }
        "401": { description: Token requerido }
  /users/me/stock-requests/{id}/cancel:
    patch:
      summary: Cancelar solicitud de stock propia pendiente
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Solicitud cancelada }
        "401": { description: Token requerido }
        "404": { description: Solicitud no encontrada o ajena }
        "409": { description: La solicitud no esta pendiente }
  /categories:
    get:
      summary: Listar categorías
      responses:
        "200": { description: Lista de categorías }
  /categories/{slug}/products:
    get:
      summary: Productos de una categoría
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Lista de productos }
  /categories/{id}/products:
    get:
      summary: Productos activos de una categoria por id
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Categoria con productos }
        "404": { description: Categoria no encontrada }
  /categories/slug/{slug}/products:
    get:
      summary: Productos activos de una categoria por slug
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200": { description: Categoria con productos }
        "404": { description: Categoria no encontrada }
  /products:
    get:
      summary: Listar productos
      responses:
        "200": { description: Lista de productos }
  /products/{id}:
    get:
      summary: Detalle de producto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Producto }
        "404": { description: Producto no encontrado }
  /products/slug/{slug}:
    get:
      summary: Detalle publico de producto por slug
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        "200": { description: Producto }
        "404": { description: Producto no encontrado }
  /products/offers:
    get:
      summary: Productos activos en oferta
      responses:
        "200": { description: Lista de productos }
  /products/featured:
    get:
      summary: Productos activos destacados
      responses:
        "200": { description: Lista de productos }
  /products/new:
    get:
      summary: Productos activos nuevos
      responses:
        "200": { description: Lista de productos }
  /products/best-sellers:
    get:
      summary: Productos mas vendidos desde ordenes confirmadas
      responses:
        "200": { description: Lista ordenada por cantidad vendida }
  /admin/products:
    get:
      summary: Listar todos los productos para admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, description: Buscar por nombre o SKU, schema: { type: string } }
      responses:
        "200": { description: Lista completa }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
    post:
      summary: Crear producto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWrite" }
      responses:
        "201": { description: Producto creado }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Categoria no encontrada }
        "409": { description: Slug o SKU duplicado }
  /admin/products/{id}:
    get:
      summary: Obtener producto para admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Producto }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Producto no encontrado }
    patch:
      summary: Editar producto
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWrite" }
      responses:
        "200": { description: Producto actualizado }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Producto o categoria no encontrado }
        "409": { description: Slug o SKU duplicado }
    delete:
      summary: Desactivar producto
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Producto desactivado }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Producto no encontrado }
  /admin/products/{id}/stock:
    patch:
      summary: Actualizar stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [stock], properties: { stock: { type: integer, minimum: 0 } } }
      responses:
        "200": { description: Stock actualizado }
        "400": { description: Stock invalido }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Producto no encontrado }
  /admin/products/{id}/price:
    patch:
      summary: Actualizar precio y oferta
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [price], properties: { price: { type: number, minimum: 0 }, compareAtPrice: { type: number, nullable: true }, isOffer: { type: boolean } } }
      responses:
        "200": { description: Precio actualizado }
        "400": { description: Precio invalido }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Producto no encontrado }
  /admin/categories:
    get:
      summary: Listar categorias para admin
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista completa }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
    post:
      summary: Crear categoria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "201": { description: Categoria creada }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "409": { description: Slug duplicado }
  /admin/categories/{id}:
    get:
      summary: Obtener categoria para admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Categoria }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Categoria no encontrada }
    patch:
      summary: Editar categoria
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Categoria actualizada }
        "400": { description: Datos invalidos }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Categoria no encontrada }
        "409": { description: Slug duplicado }
    delete:
      summary: Desactivar categoria
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Categoria desactivada }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Categoria no encontrada }
  /products/{productId}/stock-requests:
    post:
      summary: Solicitar aviso de stock como invitado o usuario autenticado
      parameters:
        - { in: path, name: productId, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestStockRequest" }
      responses:
        "201": { description: Solicitud creada }
        "400": { description: Datos de contacto invalidos }
        "404": { description: Producto no encontrado }
        "409": { description: Producto con stock o solicitud duplicada }
  /me/stock-requests:
    get:
      summary: Listar solicitudes propias
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Solicitudes del usuario }
        "401": { description: Token requerido }
  /admin/stock-requests:
    get:
      summary: Listar solicitudes para admin
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Todas las solicitudes }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
  /admin/stock-requests/{id}/status:
    patch:
      summary: Actualizar estado de solicitud
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [PENDING, CONTACTED, NOTIFIED, CANCELLED] } } }
      responses:
        "200": { description: Solicitud actualizada }
        "400": { description: Estado invalido }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Solicitud no encontrada }
  /cart:
    get:
      summary: Ver carrito propio
      description: Devuelve el carrito autenticado con precios actuales y subtotal recalculado.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Carrito }
        "401": { description: Token requerido }
    delete:
      summary: Vaciar carrito
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Carrito vaciado }
        "401": { description: Token requerido }
  /cart/validate:
    post:
      summary: Validar carrito invitado
      description: Endpoint público que hidrata items mínimos usando precio, disponibilidad y stock actuales.
      requestBody:
        required: true
        content:
          application/json:
            example:
              items:
                - productId: 1
                  quantity: 2
            schema:
              $ref: "#/components/schemas/CartItemsRequest"
      responses:
        "200": { description: Carrito invitado validado }
        "400": { description: Datos inválidos }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/sync:
    post:
      summary: Sincronizar carrito invitado
      description: Fusiona cantidades del carrito invitado con el carrito del usuario autenticado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              items:
                - productId: 1
                  quantity: 2
            schema:
              $ref: "#/components/schemas/CartItemsRequest"
      responses:
        "200": { description: Carrito sincronizado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/items:
    post:
      summary: Agregar producto al carrito
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId: { type: integer }
                quantity: { type: integer }
      responses:
        "200": { description: Producto agregado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /cart/items/{itemId}:
    patch:
      summary: Modificar cantidad de un item
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer }
      responses:
        "200": { description: Item actualizado }
        "400": { description: Datos inválidos }
        "401": { description: Token requerido }
        "404": { description: Item no encontrado o ajeno }
        "409": { description: Producto inactivo o stock insuficiente }
    delete:
      summary: Eliminar item del carrito
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Item eliminado }
        "401": { description: Token requerido }
        "404": { description: Item no encontrado o ajeno }
  /checkout/validate:
    post:
      summary: Validar checkout y calcular totales
      description: Recalcula subtotal, envio y total en backend. PICKUP usa shippingCost 0; SHIPPING usa DEFAULT_SHIPPING_COST como fallback documentado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200": { description: Checkout validado }
        "400": { description: Datos inválidos o carrito vacío }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /checkout:
    post:
      summary: Crear orden invitado o autenticado
      description: Crea una orden con totales calculados en backend. MERCADOPAGO nace PENDING_PAYMENT/PENDING y no descuenta stock; CASH nace CONFIRMED/PENDING y descuenta stock al crear.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201": { description: Orden creada }
        "400": { description: Datos inválidos o carrito vacío }
        "404": { description: Producto inexistente o inactivo }
        "409": { description: Stock insuficiente }
  /orders/track/{trackingCode}:
    get:
      summary: Seguimiento público por tracking
      parameters:
        - { in: path, name: trackingCode, required: true, schema: { type: string } }
      responses:
        "200": { description: Estado, productos y totales }
        "404": { description: Pedido no encontrado }
  /orders/{orderId}/payment:
    get:
      summary: Consultar estado de pago de una orden
      description: Usuario autenticado solo accede a sus ordenes. Invitado debe enviar trackingCode como query param.
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: integer } }
        - { in: query, name: trackingCode, required: false, schema: { type: string } }
      responses:
        "200": { description: Estado de pago de la orden }
        "401": { description: Credenciales o tracking requeridos }
        "403": { description: Orden ajena }
        "404": { description: Orden no encontrada }
  /payments/mercadopago/preference:
    post:
      summary: Crear preferencia de Mercado Pago
      description: Usa siempre order.total del backend. Rechaza ordenes CASH, pagadas o ajenas. Invitado debe enviar orderId, trackingCode y email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPreferenceRequest" }
      responses:
        "201": { description: Preferencia creada con initPoint y sandboxInitPoint }
        "400": { description: Datos invalidos }
        "401": { description: Credenciales o validacion invitado requeridas }
        "403": { description: Orden ajena }
        "404": { description: Orden no encontrada }
        "409": { description: Orden no pendiente, CASH o ya pagada }
        "502": { description: Error al crear preferencia en Mercado Pago }
  /payments/mercadopago/webhook:
    post:
      summary: Webhook Mercado Pago
      description: Consulta el pago real en Mercado Pago, actualiza Payment y Order, descuenta stock solo con APPROVED e ignora duplicados. Si MERCADOPAGO_WEBHOOK_SECRET esta configurado valida x-signature y x-request-id; si esta vacio permite modo local/test.
      parameters:
        - { in: header, name: x-signature, required: false, schema: { type: string } }
        - { in: header, name: x-request-id, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MercadoPagoWebhook" }
      responses:
        "200": { description: Evento procesado o ignorado }
        "401": { description: Firma invalida si el secret esta configurado }
        "404": { description: Orden asociada no encontrada }
        "409": { description: Monto no coincide con la orden }
  /payments/{id}/status:
    get:
      summary: Consultar pago por id
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Pago sin rawResponse }
        "401": { description: Token requerido }
        "403": { description: Pago de orden ajena }
        "404": { description: Pago no encontrado }
  /me/orders:
    get:
      summary: Listar pedidos propios
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pedidos propios }
        "401": { description: Token requerido }
  /me/orders/{id}:
    get:
      summary: Detalle de pedido propio
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Pedido propio }
        "401": { description: Token requerido }
        "404": { description: Pedido no encontrado o ajeno }
  /admin/orders:
    get:
      summary: Listar pedidos para admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: deliveryMethod, schema: { type: string, enum: [PICKUP, SHIPPING] } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Pedidos filtrados }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
  /admin/orders/{id}:
    get:
      summary: Detalle de pedido para admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Pedido }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Pedido no encontrado }
  /admin/orders/{id}/status:
    patch:
      summary: Cambiar estado operativo de pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING_PAYMENT, PAID, CONFIRMED, PREPARING, READY_FOR_PICKUP, SHIPPED, DELIVERED, CANCELLED, REFUNDED, COMPLETED] }
      responses:
        "200": { description: Estado actualizado }
        "400": { description: Estado inválido }
        "401": { description: Token requerido }
        "403": { description: Rol admin requerido }
        "404": { description: Pedido no encontrado }
        "409": { description: Transición no permitida }
components:
  schemas:
    CheckoutRequest:
      type: object
      required: [deliveryMethod]
      properties:
        deliveryMethod: { type: string, enum: [PICKUP, SHIPPING] }
        paymentMethod:
          type: string
          enum: [MERCADOPAGO, CASH]
          default: MERCADOPAGO
          description: MERCADOPAGO crea orden pendiente de pago; CASH confirma pedido y descuenta stock.
        customer:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 100 }
        address:
          type: object
          description: Obligatorio para SHIPPING.
          properties:
            recipient: { type: string }
            phone: { type: string }
            street: { type: string }
            number: { type: string }
            floor: { type: string }
            apartment: { type: string }
            city: { type: string }
            province: { type: string }
            postalCode: { type: string }
            references: { type: string }
        notes: { type: string }
    Order:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        trackingCode: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        paymentMethod: { type: string, enum: [MERCADOPAGO, CASH] }
        deliveryMethod: { type: string }
        subtotal: { type: string }
        shippingCost: { type: string }
        total: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderItem:
      type: object
      properties:
        productId: { type: integer }
        productName: { type: string }
        productSlug: { type: string }
        productSku: { type: string, nullable: true }
        quantity: { type: integer }
        unitPrice: { type: string }
        totalPrice: { type: string }
    PaymentPreferenceRequest:
      type: object
      required: [orderId]
      properties:
        orderId: { type: integer }
        trackingCode: { type: string, description: Requerido para invitados. }
        email: { type: string, format: email, description: Requerido para invitados. }
    Payment:
      type: object
      properties:
        id: { type: integer }
        provider: { type: string, enum: [MERCADOPAGO] }
        providerPaymentId: { type: string, nullable: true }
        providerPreferenceId: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, REFUNDED, IN_PROCESS] }
        amount: { type: string }
        currency: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserAddressWrite:
      type: object
      required: [recipient, street, number, city, postalCode]
      properties:
        label: { type: string, nullable: true }
        recipient: { type: string }
        phone: { type: string, nullable: true }
        street: { type: string }
        number: { type: string }
        apartment: { type: string, nullable: true }
        city: { type: string }
        state: { type: string, nullable: true }
        postalCode: { type: string }
        country: { type: string, default: AR }
        isDefault: { type: boolean }
    MercadoPagoWebhook:
      type: object
      properties:
        type: { type: string, example: payment }
        data:
          type: object
          properties:
            id: { type: string }
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        price: { type: string }
        stock: { type: integer }
    ProductWrite:
      type: object
      required: [name, price, stock, categoryId]
      properties:
        name: { type: string }
        sku: { type: string, nullable: true, description: Codigo interno unico; se normaliza a mayusculas. }
        slug: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: number, nullable: true }
        stock: { type: integer, minimum: 0 }
        categoryId: { type: integer }
        isFeatured: { type: boolean }
        isOffer: { type: boolean }
        isNew: { type: boolean }
        isActive: { type: boolean }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              alt: { type: string, nullable: true }
              isPrimary: { type: boolean }
    CategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
    GuestStockRequest:
      type: object
      description: Para usuarios autenticados el body puede omitirse.
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    CartItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 100 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
