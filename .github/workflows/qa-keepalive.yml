name: QA keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping backend healthcheck
        env:
          KEEP_ALIVE_URL: ${{ secrets.QA_BACKEND_HEALTH_URL }}
        run: node scripts/keep-render-awake.mjs --once
